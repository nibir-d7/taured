name: Build Linux toolbox

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: taured
          - target: aarch64-unknown-linux-gnu
            asset: taured-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup target add ${{ matrix.target }}
          sudo apt-get update
          sudo apt-get install -y pkg-config

      - name: Build
        run: cargo build --release --manifest-path cli/taured-lin/Cargo.toml --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C target-feature=-crt-static"

      - name: Package
        run: |
          mkdir -p dist
          cp cli/taured-lin/target/${{ matrix.target }}/release/taured dist/${{ matrix.asset }}
          chmod +x dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/taured/taured
            dist/taured-aarch64/taured-aarch64